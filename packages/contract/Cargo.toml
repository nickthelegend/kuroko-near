[package]
name = "kuroko-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = "=5.30.0-rc.1"
borsh = "1"

[dev-dependencies]
near-sdk = { version = "=5.30.0-rc.1", features = ["unit-testing"] }
near-workspaces = "=0.24.0-rc.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
